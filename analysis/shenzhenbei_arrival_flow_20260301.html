<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>深圳北到达客流 15 分钟粒度</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #637083;
      --grid: #dce3ea;
      --line: #0f766e;
      --line-soft: rgba(15, 118, 110, 0.14);
      --accent: #c2410c;
      --shadow: rgba(17, 24, 39, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 760;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(116px, 1fr));
      gap: 10px;
      min-width: min(640px, 100%);
    }
    .stat {
      background: var(--panel);
      border: 1px solid #e5eaf0;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 8px 22px var(--shadow);
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .chart-wrap {
      position: relative;
      background: var(--panel);
      border: 1px solid #e1e7ee;
      border-radius: 8px;
      padding: 16px 16px 8px;
      box-shadow: 0 12px 30px var(--shadow);
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: min(68vh, 680px);
      min-height: 430px;
    }
    .axis text {
      fill: var(--muted);
      font-size: 13px;
    }
    .grid line {
      stroke: var(--grid);
      stroke-width: 1;
    }
    .axis-line {
      stroke: #9aa8b7;
      stroke-width: 1;
    }
    .flow-area {
      fill: var(--line-soft);
    }
    .flow-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .hover-band {
      fill: transparent;
      cursor: crosshair;
    }
    .hover-band:hover {
      fill: rgba(15, 118, 110, 0.045);
    }
    .focus-line {
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 5 5;
      pointer-events: none;
      opacity: 0;
    }
    .focus-dot {
      fill: var(--accent);
      stroke: #fff;
      stroke-width: 3;
      pointer-events: none;
      opacity: 0;
    }
    .tooltip {
      position: fixed;
      z-index: 10;
      min-width: 280px;
      max-width: min(420px, calc(100vw - 32px));
      max-height: min(520px, calc(100vh - 32px));
      overflow: auto;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #d6dee7;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -105%);
    }
    .tooltip h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .tooltip .total {
      color: var(--line);
      font-weight: 760;
      margin-bottom: 8px;
    }
    .tooltip table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .tooltip th, .tooltip td {
      padding: 5px 4px;
      border-bottom: 1px solid #edf1f5;
      text-align: left;
      vertical-align: top;
    }
    .tooltip th:last-child,
    .tooltip td:last-child {
      text-align: right;
      white-space: nowrap;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
    }
    .footnote {
      color: var(--muted);
      font-size: 12px;
      margin: 10px 4px 0;
    }
    @media (max-width: 900px) {
      main { padding: 14px; }
      .topbar { display: block; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
      svg { min-height: 480px; }
    }
  </style>
</head>

    function hideTooltip() {
      tip.style.opacity = 0;
      tip.setAttribute("aria-hidden", "true");
      focusLine.style.opacity = 0;
      focusDot.style.opacity = 0;
    }
  </script>
</body>
</html>
