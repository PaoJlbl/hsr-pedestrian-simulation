<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>crowd_stable_60agents_v1 训练曲线</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #657386;
      --grid: #dce3ea;
      --mean: #0f766e;
      --std: #b45309;
      --checkpoint: #64748b;
      --shadow: rgba(17, 24, 39, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 760;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(128px, 1fr));
      gap: 10px;
      min-width: min(680px, 100%);
    }
    .stat {
      background: var(--panel);
      border: 1px solid #e5eaf0;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 8px 22px var(--shadow);
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .chart-wrap {
      position: relative;
      background: var(--panel);
      border: 1px solid #e1e7ee;
      border-radius: 8px;
      padding: 16px 16px 10px;
      box-shadow: 0 12px 30px var(--shadow);
      overflow: hidden;
    }
    .legend {
      display: flex;
      gap: 18px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 8px 60px;
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 3px;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 999px;
      background: var(--mean);
    }
    .legend span:nth-child(2)::before { background: var(--std); }
    .legend span:nth-child(3)::before {
      width: 12px;
      height: 12px;
      background: transparent;
      border-left: 2px dashed var(--checkpoint);
      border-radius: 0;
    }
    svg {
      display: block;
      width: 100%;
      height: min(68vh, 680px);
      min-height: 430px;
    }
    .axis text {
      fill: var(--muted);
      font-size: 13px;
    }
    .grid line {
      stroke: var(--grid);
      stroke-width: 1;
    }
    .axis-line {
      stroke: #9aa8b7;
      stroke-width: 1;
    }
    .mean-line, .std-line {
      fill: none;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .mean-line { stroke: var(--mean); }
    .std-line { stroke: var(--std); opacity: 0.86; }
    .mean-area {
      fill: rgba(15, 118, 110, 0.12);
    }
    .checkpoint-line {
      stroke: var(--checkpoint);
      stroke-dasharray: 4 5;
      opacity: 0.35;
    }
    .hover-band {
      fill: transparent;
      cursor: crosshair;
    }
    .hover-band:hover {
      fill: rgba(15, 118, 110, 0.045);
    }
    .focus-line {
      stroke: #9f1239;
      stroke-width: 1.5;
      stroke-dasharray: 5 5;
      pointer-events: none;
      opacity: 0;
    }
    .focus-dot {
      fill: #9f1239;
      stroke: #fff;
      stroke-width: 3;
      pointer-events: none;
      opacity: 0;
    }
    .tooltip {
      position: fixed;
      z-index: 10;
      min-width: 280px;
      max-width: min(430px, calc(100vw - 32px));
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #d6dee7;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -105%);
      font-size: 13px;
    }
    .tooltip h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .tooltip dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 14px;
      margin: 0;
    }
    .tooltip dt { color: var(--muted); }
    .tooltip dd {
      margin: 0;
      text-align: right;
      font-weight: 650;
    }
    .footnote {
      color: var(--muted);
      font-size: 12px;
      margin: 10px 4px 0;
    }
    @media (max-width: 900px) {
      main { padding: 14px; }
      .topbar { display: block; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
      .legend { margin-left: 0; flex-wrap: wrap; }
      svg { min-height: 480px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar">
      <div>
        <h1>crowd_stable_60agents_v1 训练曲线</h1>
        <div class="subtitle">行为：PedestrianCrowd；横轴为训练步数，纵轴为奖励值；鼠标悬停查看具体 step 信息</div>
      </div>
      <div class="stats" aria-label="训练摘要">
        <div class="stat"><span>最终 Step</span><strong id="lastStep"></strong></div>
        <div class="stat"><span>最终 Mean Reward</span><strong id="lastMean"></strong></div>
        <div class="stat"><span>最佳 Mean Reward</span><strong id="bestMean"></strong></div>
        <div class="stat"><span>训练耗时</span><strong id="elapsed"></strong></div>
      </div>
    </section>

    <section class="chart-wrap">
      <div class="legend"><span>Mean Reward</span><span>Std of Reward</span><span>Checkpoint</span></div>
      <svg id="chart" viewBox="0 0 1200 640" role="img" aria-label="ML-Agents 训练奖励曲线"></svg>
      <div id="tooltip" class="tooltip" aria-hidden="true"></div>
      <div class="footnote">数据来源：LOG.txt；采样频率为每 50,000 step 一次，checkpoint 由 PedestrianCrowd-*.onnx 文件名识别。</div>
    </section>
  </main>

  <script>
    const data = {"points": [{"behavior": "PedestrianCrowd", "step": 50000, "stepLabel": "50,000", "elapsed": 75.199, "elapsedLabel": "1m 15s", "meanReward": -2.964, "stdReward": 1.884}, {"behavior": "PedestrianCrowd", "step": 100000, "stepLabel": "100,000", "elapsed": 103.206, "elapsedLabel": "1m 43s", "meanReward": -2.791, "stdReward": 1.969}, {"behavior": "PedestrianCrowd", "step": 150000, "stepLabel": "150,000", "elapsed": 128.179, "elapsedLabel": "2m 8s", "meanReward": -2.054, "stdReward": 1.832}, {"behavior": "PedestrianCrowd", "step": 200000, "stepLabel": "200,000", "elapsed": 155.156, "elapsedLabel": "2m 35s", "meanReward": -1.261, "stdReward": 1.913}, {"behavior": "PedestrianCrowd", "step": 250000, "stepLabel": "250,000", "elapsed": 180.661, "elapsedLabel": "3m 1s", "meanReward": -0.376, "stdReward": 1.575}, {"behavior": "PedestrianCrowd", "step": 300000, "stepLabel": "300,000", "elapsed": 213.716, "elapsedLabel": "3m 34s", "meanReward": 0.113, "stdReward": 1.392}, {"behavior": "PedestrianCrowd", "step": 350000, "stepLabel": "350,000", "elapsed": 239.562, "elapsedLabel": "4m 0s", "meanReward": 0.143, "stdReward": 1.384}, {"behavior": "PedestrianCrowd", "step": 400000, "stepLabel": "400,000", "elapsed": 265.061, "elapsedLabel": "4m 25s", "meanReward": 0.416, "stdReward": 1.335}, {"behavior": "PedestrianCrowd", "step": 450000, "stepLabel": "450,000", "elapsed": 290.82, "elapsedLabel": "4m 51s", "meanReward": 0.663, "stdReward": 1.305}, {"behavior": "PedestrianCrowd", "step": 500000, "stepLabel": "500,000", "elapsed": 316.659, "elapsedLabel": "5m 17s", "meanReward": 0.819, "stdReward": 1.238}, {"behavior": "PedestrianCrowd", "step": 550000, "stepLabel": "550,000", "elapsed": 350.677, "elapsedLabel": "5m 51s", "meanReward": 0.808, "stdReward": 1.206}, {"behavior": "PedestrianCrowd", "step": 600000, "stepLabel": "600,000", "elapsed": 377.171, "elapsedLabel": "6m 17s", "meanReward": 0.837, "stdReward": 1.197}, {"behavior": "PedestrianCrowd", "step": 650000, "stepLabel": "650,000", "elapsed": 403.708, "elapsedLabel": "6m 44s", "meanReward": 0.849, "stdReward": 1.263}, {"behavior": "PedestrianCrowd", "step": 700000, "stepLabel": "700,000", "elapsed": 430.015, "elapsedLabel": "7m 10s", "meanReward": 0.899, "stdReward": 1.159}, {"behavior": "PedestrianCrowd", "step": 750000, "stepLabel": "750,000", "elapsed": 463.21, "elapsedLabel": "7m 43s", "meanReward": 1.065, "stdReward": 1.147}, {"behavior": "PedestrianCrowd", "step": 800000, "stepLabel": "800,000", "elapsed": 488.858, "elapsedLabel": "8m 9s", "meanReward": 1.008, "stdReward": 1.15}, {"behavior": "PedestrianCrowd", "step": 850000, "stepLabel": "850,000", "elapsed": 515.699, "elapsedLabel": "8m 36s", "meanReward": 1.235, "stdReward": 1.105}, {"behavior": "PedestrianCrowd", "step": 900000, "stepLabel": "900,000", "elapsed": 541.307, "elapsedLabel": "9m 1s", "meanReward": 1.179, "stdReward": 1.122}, {"behavior": "PedestrianCrowd", "step": 950000, "stepLabel": "950,000", "elapsed": 567.309, "elapsedLabel": "9m 27s", "meanReward": 1.144, "stdReward": 1.115}, {"behavior": "PedestrianCrowd", "step": 1000000, "stepLabel": "1,000,000", "elapsed": 600.266, "elapsedLabel": "10m 0s", "meanReward": 1.117, "stdReward": 1.175}, {"behavior": "PedestrianCrowd", "step": 1050000, "stepLabel": "1,050,000", "elapsed": 626.403, "elapsedLabel": "10m 26s", "meanReward": 1.32, "stdReward": 1.088}, {"behavior": "PedestrianCrowd", "step": 1100000, "stepLabel": "1,100,000", "elapsed": 652.576, "elapsedLabel": "10m 53s", "meanReward": 1.44, "stdReward": 1.025}, {"behavior": "PedestrianCrowd", "step": 1150000, "stepLabel": "1,150,000", "elapsed": 678.693, "elapsedLabel": "11m 19s", "meanReward": 1.395, "stdReward": 1.072}, {"behavior": "PedestrianCrowd", "step": 1200000, "stepLabel": "1,200,000", "elapsed": 704.917, "elapsedLabel": "11m 45s", "meanReward": 1.374, "stdReward": 1.108}, {"behavior": "PedestrianCrowd", "step": 1250000, "stepLabel": "1,250,000", "elapsed": 737.497, "elapsedLabel": "12m 17s", "meanReward": 1.493, "stdReward": 1.059}, {"behavior": "PedestrianCrowd", "step": 1300000, "stepLabel": "1,300,000", "elapsed": 763.718, "elapsedLabel": "12m 44s", "meanReward": 1.7, "stdReward": 0.96}, {"behavior": "PedestrianCrowd", "step": 1350000, "stepLabel": "1,350,000", "elapsed": 789.48, "elapsedLabel": "13m 9s", "meanReward": 1.6, "stdReward": 0.999}, {"behavior": "PedestrianCrowd", "step": 1400000, "stepLabel": "1,400,000", "elapsed": 815.388, "elapsedLabel": "13m 35s", "meanReward": 1.631, "stdReward": 0.988}, {"behavior": "PedestrianCrowd", "step": 1450000, "stepLabel": "1,450,000", "elapsed": 848.157, "elapsedLabel": "14m 8s", "meanReward": 1.672, "stdReward": 0.979}, {"behavior": "PedestrianCrowd", "step": 1500000, "stepLabel": "1,500,000", "elapsed": 875.107, "elapsedLabel": "14m 35s", "meanReward": 1.868, "stdReward": 0.83}, {"behavior": "PedestrianCrowd", "step": 1550000, "stepLabel": "1,550,000", "elapsed": 900.97, "elapsedLabel": "15m 1s", "meanReward": 1.851, "stdReward": 0.93}, {"behavior": "PedestrianCrowd", "step": 1600000, "stepLabel": "1,600,000", "elapsed": 927.354, "elapsedLabel": "15m 27s", "meanReward": 1.876, "stdReward": 0.928}, {"behavior": "PedestrianCrowd", "step": 1650000, "stepLabel": "1,650,000", "elapsed": 953.216, "elapsedLabel": "15m 53s", "meanReward": 1.857, "stdReward": 0.85}, {"behavior": "PedestrianCrowd", "step": 1700000, "stepLabel": "1,700,000", "elapsed": 985.739, "elapsedLabel": "16m 26s", "meanReward": 1.906, "stdReward": 0.871}, {"behavior": "PedestrianCrowd", "step": 1750000, "stepLabel": "1,750,000", "elapsed": 1011.906, "elapsedLabel": "16m 52s", "meanReward": 1.962, "stdReward": 0.804}, {"behavior": "PedestrianCrowd", "step": 1800000, "stepLabel": "1,800,000", "elapsed": 1037.64, "elapsedLabel": "17m 18s", "meanReward": 1.972, "stdReward": 0.829}, {"behavior": "PedestrianCrowd", "step": 1850000, "stepLabel": "1,850,000", "elapsed": 1063.602, "elapsedLabel": "17m 44s", "meanReward": 2.018, "stdReward": 0.746}, {"behavior": "PedestrianCrowd", "step": 1900000, "stepLabel": "1,900,000", "elapsed": 1097.059, "elapsedLabel": "18m 17s", "meanReward": 1.918, "stdReward": 0.874}, {"behavior": "PedestrianCrowd", "step": 1950000, "stepLabel": "1,950,000", "elapsed": 1122.427, "elapsedLabel": "18m 42s", "meanReward": 2.144, "stdReward": 0.769}, {"behavior": "PedestrianCrowd", "step": 2000000, "stepLabel": "2,000,000", "elapsed": 1148.293, "elapsedLabel": "19m 8s", "meanReward": 1.982, "stdReward": 0.843}], "checkpoints": [{"step": 1499946, "file": "PedestrianCrowd-1499946.onnx"}, {"step": 1999987, "file": "PedestrianCrowd-1999987.onnx"}, {"step": 2000243, "file": "PedestrianCrowd-2000243.onnx"}, {"step": 499987, "file": "PedestrianCrowd-499987.onnx"}, {"step": 999925, "file": "PedestrianCrowd-999925.onnx"}], "summary": {"runName": "crowd_stable_60agents_v1", "behavior": "PedestrianCrowd", "pointCount": 40, "firstStep": 50000, "lastStep": 2000000, "lastMeanReward": 1.982, "lastStdReward": 0.843, "bestStep": 1950000, "bestMeanReward": 2.144, "worstStep": 50000, "worstMeanReward": -2.964, "totalElapsed": "19m 8s", "checkpointCount": 5}};
    const points = data.points;
    const checkpoints = data.checkpoints;
    const summary = data.summary;
    const fmt = new Intl.NumberFormat("zh-CN");
    const fmtNum = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 3, minimumFractionDigits: 3 });

    document.getElementById("lastStep").textContent = fmt.format(summary.lastStep);
    document.getElementById("lastMean").textContent = fmtNum.format(summary.lastMeanReward);
    document.getElementById("bestMean").textContent = `${fmtNum.format(summary.bestMeanReward)} @ ${fmt.format(summary.bestStep)}`;
    document.getElementById("elapsed").textContent = summary.totalElapsed;

    const svg = document.getElementById("chart");
    const tip = document.getElementById("tooltip");
    const NS = "http://www.w3.org/2000/svg";
    const width = 1200;
    const height = 640;
    const margin = { left: 78, right: 34, top: 28, bottom: 78 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const minStep = points[0].step;
    const maxStep = points[points.length - 1].step;
    const allValues = points.flatMap(p => [p.meanReward, p.stdReward]);
    const minY = niceFloor(Math.min(...allValues));
    const maxY = niceCeil(Math.max(...allValues));

    function el(name, attrs = {}, parent = svg) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      parent.appendChild(node);
      return node;
    }
    function x(step) {
      return margin.left + ((step - minStep) / (maxStep - minStep)) * plotW;
    }
    function y(value) {
      return margin.top + plotH - ((value - minY) / (maxY - minY)) * plotH;
    }
    function niceFloor(value) {
      return Math.floor(value * 2) / 2;
    }
    function niceCeil(value) {
      return Math.ceil(value * 2) / 2;
    }
    function linePath(key) {
      return points.map((p, i) => `${i === 0 ? "M" : "L"} ${x(p.step).toFixed(2)} ${y(p[key]).toFixed(2)}`).join(" ");
    }
    function areaPath(key) {
      const baseY = y(0);
      return `M ${x(points[0].step)} ${baseY} ` + points.map(p => `L ${x(p.step).toFixed(2)} ${y(p[key]).toFixed(2)}`).join(" ") + ` L ${x(points[points.length - 1].step)} ${baseY} Z`;
    }

    const grid = el("g", { class: "grid" });
    const axis = el("g", { class: "axis" });
    const yTicks = 6;
    for (let t = 0; t <= yTicks; t++) {
      const value = minY + ((maxY - minY) / yTicks) * t;
      const yy = y(value);
      el("line", { x1: margin.left, y1: yy, x2: width - margin.right, y2: yy }, grid);
      const label = el("text", { x: margin.left - 12, y: yy + 4, "text-anchor": "end" }, axis);
      label.textContent = fmtNum.format(value);
    }
    el("line", { class: "axis-line", x1: margin.left, y1: y(0), x2: width - margin.right, y2: y(0) });
    el("line", { class: "axis-line", x1: margin.left, y1: margin.top, x2: margin.left, y2: margin.top + plotH });

    const stepTicks = 5;
    for (let i = 0; i <= stepTicks; i++) {
      const value = minStep + ((maxStep - minStep) / stepTicks) * i;
      const xx = x(value);
      el("line", { x1: xx, y1: margin.top + plotH, x2: xx, y2: margin.top + plotH + 6, stroke: "#9aa8b7" });
      const label = el("text", { x: xx, y: margin.top + plotH + 30, "text-anchor": i === 0 ? "start" : i === stepTicks ? "end" : "middle" }, axis);
      label.textContent = `${Math.round(value / 10000) / 100}M`;
    }

    const yTitle = el("text", { x: 20, y: margin.top + 12, transform: `rotate(-90 20 ${margin.top + 12})`, "text-anchor": "end", fill: "#657386", "font-size": 13 });
    yTitle.textContent = "Reward";
    const xTitle = el("text", { x: width / 2, y: height - 20, "text-anchor": "middle", fill: "#657386", "font-size": 13 });
    xTitle.textContent = "Training Step";

    checkpoints.forEach(cp => {
      if (cp.step >= minStep && cp.step <= maxStep) {
        const xx = x(cp.step);
        el("line", { class: "checkpoint-line", x1: xx, y1: margin.top, x2: xx, y2: margin.top + plotH });
      }
    });

    el("path", { class: "mean-area", d: areaPath("meanReward") });
    el("path", { class: "mean-line", d: linePath("meanReward") });
    el("path", { class: "std-line", d: linePath("stdReward") });

    points.forEach(p => {
      el("circle", { cx: x(p.step), cy: y(p.meanReward), r: 3.5, fill: "#0f766e", opacity: 0.86 });
      el("circle", { cx: x(p.step), cy: y(p.stdReward), r: 3, fill: "#b45309", opacity: 0.76 });
    });

    const focusLine = el("line", { class: "focus-line", y1: margin.top, y2: margin.top + plotH });
    const focusDot = el("circle", { class: "focus-dot", r: 6 });
    const overlays = el("g");
    points.forEach((p, i) => {
      const prevX = i === 0 ? margin.left : (x(points[i - 1].step) + x(p.step)) / 2;
      const nextX = i === points.length - 1 ? width - margin.right : (x(points[i + 1].step) + x(p.step)) / 2;
      const rect = el("rect", {
        class: "hover-band",
        x: prevX,
        y: margin.top,
        width: Math.max(1, nextX - prevX),
        height: plotH
      }, overlays);
      rect.addEventListener("mousemove", event => showTooltip(event, p));
      rect.addEventListener("mouseleave", hideTooltip);
    });

    function checkpointAt(step) {
      return checkpoints.filter(cp => Math.abs(cp.step - step) <= 30000).map(cp => cp.file).join("<br>");
    }
    function showTooltip(event, p) {
      const xx = x(p.step);
      focusLine.setAttribute("x1", xx);
      focusLine.setAttribute("x2", xx);
      focusLine.style.opacity = 1;
      focusDot.setAttribute("cx", xx);
      focusDot.setAttribute("cy", y(p.meanReward));
      focusDot.style.opacity = 1;

      const checkpoint = checkpointAt(p.step);
      tip.innerHTML = `<h2>Step ${fmt.format(p.step)}</h2>
        <dl>
          <dt>Mean Reward</dt><dd style="color:#0f766e">${fmtNum.format(p.meanReward)}</dd>
          <dt>Std of Reward</dt><dd style="color:#b45309">${fmtNum.format(p.stdReward)}</dd>
          <dt>Time Elapsed</dt><dd>${p.elapsedLabel}</dd>
          <dt>Behavior</dt><dd>${p.behavior}</dd>
          ${checkpoint ? `<dt>Checkpoint</dt><dd>${checkpoint}</dd>` : ""}
        </dl>`;
      tip.style.opacity = 1;
      tip.setAttribute("aria-hidden", "false");

      const pad = 14;
      let left = event.clientX;
      let top = event.clientY - 12;
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
      requestAnimationFrame(() => {
        const box = tip.getBoundingClientRect();
        if (box.left < pad) left += pad - box.left;
        if (box.right > window.innerWidth - pad) left -= box.right - (window.innerWidth - pad);
        if (box.top < pad) top = event.clientY + 22;
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
      });
    }
    function hideTooltip() {
      tip.style.opacity = 0;
      tip.setAttribute("aria-hidden", "true");
      focusLine.style.opacity = 0;
      focusDot.style.opacity = 0;
    }
  </script>
</body>
</html>
